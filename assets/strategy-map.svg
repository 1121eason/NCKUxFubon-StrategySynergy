<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">富邦信用卡：策略診斷到價值實現</title><desc id="desc">競爭與資源分析，連結四項策略與三類綜效，再以資料和決策關卡驗證。所有方案為個案延伸設計。</desc>
<rect width="1200" height="650" rx="24" fill="#0c192c"/>
<g font-family="Arial, Noto Sans CJK TC, PingFang TC, sans-serif">
<text x="48" y="60" fill="#77d8cb" font-size="15" letter-spacing="3">FUBON · STRATEGY &amp; SYNERGY</text>
<text x="48" y="110" fill="white" font-size="32" font-weight="700">把成長機會轉成可驗證的價值</text>
<text x="48" y="146" fill="#b4c3d6" font-size="18">市場與資源 → 策略選擇 → 執行責任 → 證據與修正</text>
<rect x="48" y="190" width="270" height="328" rx="16" fill="#172a43"/>
<text x="72" y="232" fill="#77d8cb" font-size="17">01  診斷</text>
<text x="72" y="279" fill="white" font-size="23" font-weight="700">競爭、資源、顧客</text>
<g fill="#d2dbe7" font-size="19"><text x="72" y="325">五力：競爭與合作依賴</text><text x="72" y="366">VRIO：價值與可持續性</text><text x="72" y="407">SWOT：從清單到取捨</text><text x="72" y="470">先分清併購與聯名合作</text></g>
<path d="M330 350H370" stroke="#77d8cb" stroke-width="3"/><path d="m362 343 9 7-9 7" fill="none" stroke="#77d8cb" stroke-width="3"/>
<rect x="382" y="190" width="365" height="328" rx="16" fill="#173b46"/>
<text x="406" y="232" fill="#77d8cb" font-size="17">02  選擇與機制</text>
<text x="406" y="279" fill="white" font-size="23" font-weight="700">四項策略 × 三類綜效</text>
<g fill="#d2e9e6" font-size="19"><text x="406" y="325">數位任務 · ESG 參與</text><text x="406" y="366">國內成長 · 海外市場界定</text><text x="406" y="425">功能效率 / 商業模式 / 策略能力</text><text x="406" y="470">為難量化機會保留評估空間</text></g>
<path d="M759 350H799" stroke="#77d8cb" stroke-width="3"/><path d="m791 343 9 7-9 7" fill="none" stroke="#77d8cb" stroke-width="3"/>
<rect x="811" y="190" width="341" height="328" rx="16" fill="#172a43"/>
<text x="835" y="232" fill="#77d8cb" font-size="17">03  驗證與治理</text>
<text x="835" y="279" fill="white" font-size="23" font-weight="700">基準、責任、決策關卡</text>
<g fill="#d2dbe7" font-size="19"><text x="835" y="325">服務穩定與任務表現</text><text x="835" y="366">增量貢獻與成本投入</text><text x="835" y="407">能力里程碑與重用條件</text><text x="835" y="470">依證據擴大、修正或停止</text></g>
<text x="48" y="572" fill="white" font-size="22" font-weight="700">規模是機會，價值需要實現條件。</text>
<text x="48" y="611" fill="#b4c3d6" font-size="16">原創個案示意圖 · 2026 公開整理 · 非企業採用方案或實測結果</text></g></svg>